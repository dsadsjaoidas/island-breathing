<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#120c08">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<title>الجزيرة تتنفّس</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app" data-mode="title">
  <div id="stage">
    <canvas id="cv" width="320" height="180"></canvas>
    <div id="side">
      <div id="hud" class="panel" hidden></div>
      <div id="quests" class="panel" hidden></div>
    </div>
    <div id="topbar">
      <button id="btnMenu" class="mini panel ico" title="القائمة"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3h12v2H2zM2 7h12v2H2zM2 11h12v2H2z"/></svg></button>
      <button id="btnSound" class="mini panel ico" title="كتم/تشغيل الصوت"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6h3l4-3v10l-4-3H2z"/><path class="on" d="M11 5.5c1 .8 1 4.2 0 5M12.6 3.8c2 1.8 2 6.6 0 8.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path class="off" d="M11 6l4 4M15 6l-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      <button id="btnVolDown" class="mini panel ico" title="خفض الصوت"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 7h10v2.2H3z"/></svg></button>
      <span id="volLevel" class="mini panel">70%</span>
      <button id="btnVolUp" class="mini panel ico" title="رفع الصوت"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 7h10v2.2H3z"/><path d="M6.9 3h2.2v10H6.9z"/></svg></button>
      <button id="btnFull" class="mini panel ico" title="ملء الشاشة" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 1.5h5v2h-3v3h-2zM14.5 1.5h-5v2h3v3h2zM1.5 14.5h5v-2h-3v-3h-2zM14.5 14.5h-5v-2h3v-3h2z"/></svg></button>
      <span id="netBadge" class="mini panel" hidden></span>
    </div>
    <div id="toasts"></div>
    <div id="prompt" class="panel" hidden></div>
    <div id="cg" hidden><div id="cgText"></div><div class="cg-next">▼</div></div>
    <div id="touch" hidden>
      <div id="stick"><div id="knob"></div></div>
      <button id="btnAct" class="panel">تفاعل</button>
    </div>
  </div>

  <div id="dialog" hidden>
    <div id="portraitBox" class="panel">
      <canvas id="portrait" width="16" height="16"></canvas>
      <div id="portraitName"></div>
    </div>
    <div id="textBox" class="panel">
      <div id="nameTag" class="panel" hidden></div>
      <div id="text"></div>
      <div id="choices" hidden></div>
      <div id="next" hidden>▼</div>
    </div>
  </div>

  <div id="chapter" hidden><div class="ch-title"></div><div class="ch-sub"></div></div>
  <div id="fade"></div>

  <div id="title">
    <h1>الجزيرة تتنفّس</h1>
    <p class="tagline">بعض الجزر لا تُرسم على الخرائط... لأنها لا تبقى في مكانها</p>

    <div id="mainMenu" class="menu">
      <button id="btnNew" class="btn panel">رحلة جديدة</button>
      <button id="btnContinue" class="btn panel" hidden>متابعة الرحلة</button>
      <button id="btnMulti" class="btn panel">لعب جماعي</button>
      <p id="endingCount"></p>
    </div>

    <div id="lobby" class="panel" hidden>
      <h2>لعب جماعي (لاعبان)</h2>
      <p class="small">المضيف يلعب يونس، والمنضم يلعب ساس.</p>
      <div id="roomCode" hidden></div>
      <div id="hostControls" hidden>
        <button id="btnStartRoom" class="btn panel">ابدأ رحلة جديدة</button>
        <button id="btnContinueRoom" class="btn panel" hidden>تابع الرحلة المحفوظة</button>
      </div>
      <div class="row">
        <button id="btnHost" class="btn panel">إنشاء غرفة</button>
      </div>
      <div class="row">
        <input id="codeInput" maxlength="5" placeholder="الرمز" autocomplete="off" spellcheck="false">
        <button id="btnJoin" class="btn panel">انضمام</button>
      </div>
      <p id="lobbyStatus"></p>
      <button id="btnBack" class="mini panel">رجوع</button>
    </div>

    <p class="hint">WASD أو الأسهم للحركة · E أو مسافة للتفاعل والمتابعة · الأرقام للاختيار</p>
    <p class="hint touch-hint">على الجوال: عصا التحكم للحركة · زر «تفاعل» للتفاعل والمتابعة · يُفضَّل الوضع الأفقي</p>
  </div>
</div>

<script src="js/assets.js"></script>
<script src="js/characters.js"></script>
<script src="js/renderer.js"></script>
<script src="js/scenes.js"></script>
<script src="js/sea.js"></script>
<script src="js/cg.js"></script>
<script src="js/cg2.js"></script>
<script src="js/audio.js"></script>
<script src="js/net.js"></script>
<script src="js/view.js"></script>
<script src="js/world/tiles.js"></script>
<script src="js/world/sprites.js"></script>
<script src="js/world/maps.js"></script>
<script src="js/world/fx.js"></script>
<script src="js/world/world.js"></script>
<script src="js/story/dsl.js"></script>
<script src="js/story/prologue.js"></script>
<script src="js/story/act1.js"></script>
<script src="js/story/act2.js"></script>
<script src="js/story/act2_jungle.js"></script>
<script src="js/story/act3.js"></script>
<script src="js/story/act3_ribs.js"></script>
<script src="js/story/act4.js"></script>
<script src="js/story/coop.js"></script>
<script src="js/menu.js"></script>
<script src="js/engine.js"></script>
<script>Assets.load().then(() => Game.boot());</script>
</body>
</html>
